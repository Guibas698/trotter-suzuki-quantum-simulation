[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trotter-suzuki-quantum-simulation"
version = "1.0.0"
description = "Implementação e análise experimental das fórmulas de produto de Trotter–Suzuki para simulação Hamiltoniana quântica."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Seminário de Computação Quântica" }
]
dependencies = [
    "qiskit>=1.0.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "matplotlib>=3.8.0",
    "pandas>=2.1.0",
    "streamlit>=1.32.0",
    "pylatexenc>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"
